<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — ЕГДС</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght=300;400;700;900&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="css/auth.css"> 
    <link rel="stylesheet" href="css/dark-theme.css"> 

</head>
<body>

<div class="auth-wrapper">
    <div class="auth-container">
        
        <a href="/" class="back-link">
            <span>&larr;</span> Вернуться к каталогу
        </a>

        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login-form">Вход</button>
            <button class="tab-btn" data-tab="register-form">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Ваш Email</label>
                <input type="email" id="login-email" required placeholder="example@mail.ru">
            </div>
            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Войти</button>
        </form>

      <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="reg-lastname">Фамилия *</label>
                <input type="text" id="reg-lastname" required placeholder="Иванов">
                <span class="error-msg" id="err-lastname" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label for="reg-firstname">Имя *</label>
                <input type="text" id="reg-firstname" required placeholder="Иван">
                <span class="error-msg" id="err-firstname" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label for="reg-middlename">Отчество</label>
                <input type="text" id="reg-middlename" placeholder="Иванович">
            </div>

            <div class="form-group">
                <label for="reg-birthday">Дата рождения * (от 16 лет)</label>
                <input type="date" id="reg-birthday" required>
                <span class="error-msg" id="err-birthday" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label for="reg-email">E-mail *</label>
                <input type="email" id="reg-email" required placeholder="example@mail.ru">
                <span class="error-msg" id="err-email" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

            <div class="form-group">
                <label for="reg-phone">Телефон *</label>
                <input type="tel" id="reg-phone" maxlength="13" placeholder="+375XXXXXXXXX">
                <span class="error-msg" id="err-phone" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

       <div class="form-group" style="margin-top: 15px;">
                <label>Способ задания пароля *</label>
                <div class="radio-group">
                    <label class="inline-label">
                        <input type="radio" name="pass-method" value="manual" checked> Сам
                    </label>
                    <label class="inline-label">
                        <input type="radio" name="pass-method" value="auto"> Автоматически
                    </label>
                </div>
            </div>

            <div id="manual-password-block">
                <div class="form-group">
                    <label for="reg-password">Пароль *</label>
                    <input type="password" id="reg-password" placeholder="Минимум 6 символов">
                    <span class="error-msg" id="err-password" style="color: #ff4d4d; font-size: 12px;"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password-confirm">Повторите пароль *</label>
                    <input type="password" id="reg-password-confirm">
                    <span class="error-msg" id="err-password-confirm" style="color: #ff4d4d; font-size: 12px;"></span>
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="reg-nickname">Никнейм *</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="reg-nickname" required style="flex: 1;">
                    <button type="button" id="btn-generate-nick" style="padding: 0 15px; cursor: pointer;">Сгенерировать</button>
                </div>
                <span class="error-msg" id="err-nickname" style="color: #ff4d4d; font-size: 12px;"></span>
            </div>

          <div class="checkbox-group">
                <input type="checkbox" id="reg-agreement" required>
                <label for="reg-agreement" class="inline-label">Согласен с правилами *</label>
            </div>

            <button type="submit" id="btn-register-submit" class="btn-submit" disabled>Зарегистрироваться</button>
        </form>

    </div>
</div>


<script src="js/auth.js"></script>

</body>
</html>
