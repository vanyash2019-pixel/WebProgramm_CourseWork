<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — ЕГДС</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght=300;400;700;900&display=swap" rel="stylesheet">
         <link rel="stylesheet" href="css/auth.css"> 
    <link rel="stylesheet" href="css/dark-theme.css"> 

</head>
<body>

<div class="auth-wrapper">
    <div class="auth-container">
        
        <a href="/" class="back-link">
            <span>&larr;</span> Вернуться к каталогу
        </a>

        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login-form">Вход</button>
            <button class="tab-btn" data-tab="register-form">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Ваш Email</label>
                <input type="email" id="login-email" required placeholder="example@mail.ru">
            </div>
            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="reg-name">Ваше имя</label>
                <input type="text" id="reg-name" required placeholder="Иван И.">
            </div>
            <div class="form-group">
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" required placeholder="example@mail.ru">
            </div>
            <div class="form-group">
                <label for="reg-phone">Телефон</label>
                <input type="tel" id="reg-phone" required placeholder="+7 (___) ___-__-__">
            </div>
            <div class="form-group">
                <label for="reg-password">Придумайте Пароль</label>
                <input type="password" id="reg-password" required placeholder="Минимум 6 символов">
            </div>
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>

    </div>
</div>


<script src="js/auth.js"></script>

</body>
</html>
